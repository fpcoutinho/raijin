services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: raijin
      POSTGRES_PASSWORD: raijin
      POSTGRES_DB: raijin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Storage S3-compatible local.
  # Mesmo protocolo de produção (presigned PUT/GET) — só troca endpoint/credenciais via env.
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: raijin
      MINIO_ROOT_PASSWORD: raijin123
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - storagedata:/data

  # Cria o bucket de dev na subida e sai. O bucket é PRIVADO (sem anonymous
  # policy), isso significa que todo acesso passa por URL assinada.
  storage-init:
    image: minio/mc
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://storage:9000 raijin raijin123; do sleep 1; done;
      mc mb --ignore-existing local/raijin;
      "

volumes:
  pgdata:
  storagedata:
