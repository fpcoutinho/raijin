[package]
name = "raijin"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "rust_decimal", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# Storage S3-compatible
aws-sdk-s3 = "1.141.0"
aws-credential-types = "1.3.0"
async-trait = "0.1.91"

# Streaming de texto do proxy de IA (llm::TextGenerator) — Box<dyn Stream>
futures = "0.3.33"

# Auth
argon2 = "0.5.3"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum-extra = { version = "0.12", features = ["cookie"] }
# axum-extra usa a crate `cookie`, que usa `time` pro max_age do cookie —
# já está no grafo via `cookie`, só precisa ser dependência direta pra nomear.
time = "0.3"
rand = "0.10"
sha2 = "0.11"
base64 = "0.22"
# Comparação em tempo constante do X-Task-Token — já está no grafo via sqlx.
subtle = "2.6"

# Rate limiting das rotas de auth. `default-features = false` corta a
# integração com tonic (gRPC) do default — só usamos a integração com axum.
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }

# Infra do servidor
dotenvy = "0.15.7"
thiserror = "2.0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }

# Runtime AWS Lambda. default-features = false corta apigw_rest, alb,
# apigw_websockets, vpc_lattice — só usamos payload v2 (HTTP API/Function URL).
lambda_http = { version = "1.3.0", default-features = false, features = ["apigw_http", "tracing"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
